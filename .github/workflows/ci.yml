name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    # Nightly run against each upstream app's develop branch to catch breakage early.
    - cron: "0 2 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # "pinned" uses compat/pinned.py commits (set them first); "develop" tracks upstream.
        upstream: [pinned, develop]

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s
          --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    env:
      FRAPPE_BRANCH: version-15

    steps:
      - name: Checkout whatsapp_flow
        uses: actions/checkout@v4
        with:
          path: whatsapp_flow

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system deps + bench
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1 wkhtmltopdf
          npm install -g yarn
          pip install frappe-bench

      - name: Init bench
        run: |
          bench init --frappe-branch "$FRAPPE_BRANCH" --skip-redis-config-generation --skip-assets frappe-bench
          cd frappe-bench
          bench get-app erpnext --branch "$FRAPPE_BRANCH"

      - name: Resolve upstream refs
        id: refs
        run: |
          if [ "${{ matrix.upstream }}" = "develop" ]; then
            echo "ref=develop" >> "$GITHUB_OUTPUT"
          else
            # pinned: read hashes from compat/pinned.py (fallback to default branch if unset)
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

      - name: Get the three upstream apps
        working-directory: frappe-bench
        run: |
          REF='${{ steps.refs.outputs.ref }}'
          get() { bench get-app "$1" "$2" ${REF:+--branch "$REF"} || bench get-app "$1" "$2"; }
          get frappe_whatsapp https://github.com/shridarpatil/frappe_whatsapp
          get whatsapp_chat https://github.com/shridarpatil/whatsapp_chat
          get frappe_whatsapp_chatbot https://github.com/shridarpatil/frappe_whatsapp_chatbot

      - name: Link whatsapp_flow into the bench
        working-directory: frappe-bench
        run: |
          bench get-app whatsapp_flow "$GITHUB_WORKSPACE/whatsapp_flow"

      - name: Create site + install apps (in order)
        working-directory: frappe-bench
        run: |
          bench new-site test.localhost \
            --mariadb-root-password root \
            --admin-password admin \
            --no-mariadb-socket
          bench --site test.localhost set-config ignore_csrf 1
          bench --site test.localhost install-app erpnext
          bench --site test.localhost install-app frappe_whatsapp
          bench --site test.localhost install-app whatsapp_chat
          bench --site test.localhost install-app frappe_whatsapp_chatbot
          bench --site test.localhost install-app whatsapp_flow

      - name: Run tests
        working-directory: frappe-bench
        run: |
          bench --site test.localhost set-config allow_tests true
          bench --site test.localhost run-tests --app whatsapp_flow
